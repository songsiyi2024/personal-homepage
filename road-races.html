      <section class="section-reveal">
        <div class="section-head running-head">
          <div>
            <h2 data-i18n="run-race-hub-road">路跑赛事名单</h2>
            <p class="hero-copy" data-i18n="race-copy">数据来自《路跑及越野赛赛历》。你可以按赛事类别、地区、参赛状态筛选，并按日期或名称排序。</p>

          </div>

        <article class="card race-toolbar">
          <div class="race-toolbar-grid">
            <label class="race-field">
              <span data-i18n="race-filter-region">地区</span>
              <select id="race-filter-region"></select>
            </label>

            <label class="race-field">
              <span data-i18n="race-filter-road-type">路跑项目</span>
              <select id="race-filter-road-type">
                <option value="all" data-i18n="race-opt-all">全部</option>
                <option value="全" data-i18n="race-opt-full">全马</option>
                <option value="半" data-i18n="race-opt-half">半马</option>
                <option value="全/半" data-i18n="race-opt-full-half">全马/半马</option>
              </select>
            </label>

            <label class="race-field">
              <span data-i18n="race-filter-caa-cert">中国田协认证</span>
              <select id="race-filter-caa-cert"></select>
            </label>

            <label class="race-field">
              <span data-i18n="race-filter-wa-cert">世界田联认证</span>
              <select id="race-filter-wa-cert"></select>
            </label>

            <label class="race-field">
              <span data-i18n="race-filter-status">参与状态</span>
              <select id="race-filter-status">
                <option value="all" data-i18n="race-opt-all">全部</option>
                <option value="joined" data-i18n="race-opt-joined">已参与</option>
                <option value="not-joined" data-i18n="race-opt-not-joined">未参与</option>
              </select>
            </label>

            <label class="race-field">
              <span data-i18n="race-filter-search">赛事名称关键词</span>
              <input id="race-filter-search" type="search" data-i18n-placeholder="race-search-placeholder" placeholder="输入赛事名称" />
            </label>

            <label class="race-field">
              <span data-i18n="race-sort-by">排序方式</span>
              <select id="race-sort-by">
                <option value="seq-asc" data-i18n="race-sort-seq-asc">序号从小到大</option>
                <option value="seq-desc" data-i18n="race-sort-seq-desc">序号从大到小</option>
                <option value="date-asc" data-i18n="race-sort-date-asc">日期从早到晚</option>
                <option value="date-desc" data-i18n="race-sort-date-desc">日期从晚到早</option>
                <option value="name-asc" data-i18n="race-sort-name-asc">名称 A-Z</option>
                <option value="name-desc" data-i18n="race-sort-name-desc">名称 Z-A</option>
              </select>
            </label>
          </div>
        </article>

        <div class="race-stat-row" id="race-stat-row"></div>

        <article class="card race-table-wrap">
          <div class="race-count" id="race-count"></div>
          <div class="race-table-scroll">
            <table class="race-table">
              <thead>
                <tr>
                  <th data-i18n="race-col-seq">序号</th>
                  <th data-i18n="race-col-name">赛事名称</th>
                  <th data-i18n="race-col-region">地区</th>
                  <th data-i18n="race-col-type">项目</th>
                  <th data-i18n="race-col-date">日期</th>
                  <th data-i18n="race-col-cert">认证</th>
                  <th data-i18n="race-col-status">参与状态</th>
                </tr>
              </thead>
              <tbody id="race-tbody"></tbody>

    <script src="script.js"></script>
    <script>
      (function () {
        const rawEntries = (Array.isArray(window.raceCalendarEntries) ? window.raceCalendarEntries : []).filter((item) => item.category === "road");
        const entries = rawEntries
          .slice()
          .sort((left, right) => {
            const leftSeq = Number(left.seq);
            const rightSeq = Number(right.seq);
            const safeLeft = Number.isFinite(leftSeq) ? leftSeq : Number.MAX_SAFE_INTEGER;
            const safeRight = Number.isFinite(rightSeq) ? rightSeq : Number.MAX_SAFE_INTEGER;
            return safeLeft - safeRight || String(left.name || "").localeCompare(String(right.name || ""), "zh-Hans-CN");
          })
          .map((item, index) => ({
            ...item,
            seq: index + 1,
          }));
        const els = {
          region: document.getElementById("race-filter-region"),
          roadType: document.getElementById("race-filter-road-type"),
          caaCert: document.getElementById("race-filter-caa-cert"),
          waCert: document.getElementById("race-filter-wa-cert"),
          status: document.getElementById("race-filter-status"),
          search: document.getElementById("race-filter-search"),
          sortBy: document.getElementById("race-sort-by"),
          count: document.getElementById("race-count"),
          tbody: document.getElementById("race-tbody"),
          statRow: document.getElementById("race-stat-row"),
        };

        function parseDateCode(dateCode) {
          const raw = String(dateCode || "").padStart(4, "0");
          const month = Number(raw.slice(0, 2));
          const day = Number(raw.slice(2));
          const unknownDay = day === 99;
          const safeMonth = month >= 1 && month <= 12 ? month : 1;
          const safeDay = unknownDay ? 99 : Math.max(1, Math.min(day || 1, 31));
          return {
            month: safeMonth,
            day: safeDay,
            unknownDay,
            sortValue: safeMonth * 100 + safeDay,
          };
        }

        function formatDate(dateCode, lang) {
          const parsed = parseDateCode(dateCode);
          if (lang === "en") {
            return parsed.unknownDay
              ? `${String(parsed.month).padStart(2, "0")} (TBD)`
              : `${String(parsed.month).padStart(2, "0")}-${String(parsed.day).padStart(2, "0")}`;
          }
          return parsed.unknownDay ? `${parsed.month}月（日期待定）` : `${parsed.month}月${parsed.day}日`;
        }

        function certLabel(item) {
          const cert = [];
          if (item.caaCert) cert.push(`田协 ${item.caaCert}`);
          if (item.waCert) cert.push(`WA ${item.waCert}`);
          return cert.length ? cert.join(" / ") : "-";
        }

        function roadTypeLabel(type, lang) {
          if (lang === "en") {
            if (type === "全") return "Full";
            if (type === "半") return "Half";
            if (type === "全/半") return "Full/Half";
            return type || "-";
          }
          if (type === "全") return "全马";
          if (type === "半") return "半马";
          if (type === "全/半") return "全马/半马";
          return type || "-";
        }

        function statusLabel(joined, lang) {
          return lang === "en" ? (joined ? "Joined" : "Not joined") : joined ? "已参与" : "未参与";
        }

        function buildRegionOptions() {
          const regions = Array.from(new Set(entries.map((item) => item.region).filter(Boolean))).sort((a, b) =>
            a.localeCompare(b, "zh-Hans-CN")
          );
          const previous = els.region.value || "all";
          els.region.innerHTML = "";
          const all = document.createElement("option");
          all.value = "all";
          all.textContent = window.currentLang === "en" ? "All" : "全部";
          els.region.appendChild(all);
          regions.forEach((region) => {
            const option = document.createElement("option");
            option.value = region;
            option.textContent = region;
            els.region.appendChild(option);
          });
          if (Array.from(els.region.options).some((opt) => opt.value === previous)) {
            els.region.value = previous;
          }
        }

        function buildCertOptions() {
          const certSources = [
            { element: els.caaCert, key: "caaCert" },
            { element: els.waCert, key: "waCert" },
          ];

          certSources.forEach(({ element, key }) => {
            const values = Array.from(new Set(entries.map((item) => String(item[key] || "").trim()).filter(Boolean)));
            if (key === "caaCert" && !values.includes("B")) {
              values.push("B");
            }
            if (key === "waCert") {
              const waPriority = {
                platinum: 1,
                gold: 2,
                elite: 3,
                label: 4,
              };
              values.sort((a, b) => {
                const aKey = String(a || "").trim().toLowerCase();
                const bKey = String(b || "").trim().toLowerCase();
                const aRank = waPriority[aKey] || Number.MAX_SAFE_INTEGER;
                const bRank = waPriority[bKey] || Number.MAX_SAFE_INTEGER;
                return aRank - bRank || aKey.localeCompare(bKey, "en");
              });
            } else {
              values.sort((a, b) => a.localeCompare(b, "zh-Hans-CN"));
            }
            const previous = element.value || "all";

            element.innerHTML = "";

            const all = document.createElement("option");
            all.value = "all";
            all.textContent = window.currentLang === "en" ? "All" : "全部";
            element.appendChild(all);

            const none = document.createElement("option");
            none.value = "__none__";
            none.textContent = window.currentLang === "en" ? "No certification" : "无认证";
            element.appendChild(none);

            values.forEach((value) => {
              const option = document.createElement("option");
              option.value = value;
              if (key === "waCert") {
                const certKey = String(value || "").trim().toLowerCase();
                const waLabelZh = {
                  platinum: "白金",
                  gold: "金标",
                  elite: "精英",
                  label: "标牌",
                };
                const waLabelEn = {
                  platinum: "Platinum",
                  gold: "Gold",
                  elite: "Elite",
                  label: "Label",
                };
                option.textContent = window.currentLang === "en"
                  ? (waLabelEn[certKey] || value)
                  : (waLabelZh[certKey] || value);
              } else {
                option.textContent = window.currentLang === "en" ? value : `${value}类`;
              }
              element.appendChild(option);
            });

            if (Array.from(element.options).some((opt) => opt.value === previous)) {
              element.value = previous;
            }
          });
        }

        function getFiltered() {
          const filters = {
            region: els.region.value,
            roadType: els.roadType.value,
            caaCert: els.caaCert.value,
            waCert: els.waCert.value,
            status: els.status.value,
            keyword: els.search.value.trim().toLowerCase(),
            sortBy: els.sortBy.value,
          };

          let filtered = entries.filter((item) => {
            if (filters.region !== "all" && item.region !== filters.region) return false;
            if (filters.roadType !== "all" && item.type !== filters.roadType) return false;

            if (filters.caaCert === "__none__" && String(item.caaCert || "").trim()) return false;
            if (filters.caaCert !== "all" && filters.caaCert !== "__none__" && String(item.caaCert || "").trim() !== filters.caaCert) return false;

            if (filters.waCert === "__none__" && String(item.waCert || "").trim()) return false;
            if (filters.waCert !== "all" && filters.waCert !== "__none__" && String(item.waCert || "").trim() !== filters.waCert) return false;

            if (filters.status === "joined" && !item.participated) return false;
            if (filters.status === "not-joined" && item.participated) return false;
            if (filters.keyword && !String(item.name || "").toLowerCase().includes(filters.keyword)) return false;
            return true;
          });

          filtered = filtered.sort((a, b) => {
            const ad = parseDateCode(a.dateCode).sortValue;
            const bd = parseDateCode(b.dateCode).sortValue;
            if (filters.sortBy === "seq-asc") return a.seq - b.seq;
            if (filters.sortBy === "seq-desc") return b.seq - a.seq;
            if (filters.sortBy === "date-asc") return ad - bd || a.seq - b.seq;
            if (filters.sortBy === "date-desc") return bd - ad || a.seq - b.seq;
            if (filters.sortBy === "name-asc") return String(a.name).localeCompare(String(b.name), "zh-Hans-CN");
            if (filters.sortBy === "name-desc") return String(b.name).localeCompare(String(a.name), "zh-Hans-CN");
            return a.seq - b.seq;
          });

          return filtered;
        }

        function renderStats(filtered) {
          const lang = window.currentLang || "zh";
          const joined = filtered.filter((item) => item.participated).length;
          const full = filtered.filter((item) => item.type === "全" || item.type === "全/半").length;
          const half = filtered.filter((item) => item.type === "半" || item.type === "全/半").length;
          const labels = lang === "en"
            ? [["Current total", filtered.length], ["Full", full], ["Half", half], ["Joined", joined]]
            : [["当前筛选总数", filtered.length], ["全马", full], ["半马", half], ["已参与", joined]];
          els.statRow.innerHTML = "";
          labels.forEach(([title, value]) => {
            const item = document.createElement("article");
            item.className = "card race-stat";
            const label = document.createElement("span");
            const strong = document.createElement("strong");
            label.textContent = title;
            strong.textContent = String(value);
            item.append(label, strong);
            els.statRow.appendChild(item);
          });
        }

        function renderTable(filtered) {
          const lang = window.currentLang || "zh";
          els.count.textContent = lang === "en" ? `Showing ${filtered.length} events` : `共 ${filtered.length} 场赛事`;
          els.tbody.innerHTML = "";

          if (!filtered.length) {
            const tr = document.createElement("tr");
            const td = document.createElement("td");
            td.colSpan = 7;
            td.className = "race-empty";
            td.textContent = lang === "en" ? "No events match current filters." : "当前筛选条件下没有匹配赛事。";
            tr.appendChild(td);
            els.tbody.appendChild(tr);
            return;
          }

          filtered.forEach((item) => {
            const tr = document.createElement("tr");
            const seqTd = document.createElement("td");
            seqTd.className = "race-seq";
            seqTd.textContent = String(item.seq);
            const nameTd = document.createElement("td");
            const name = document.createElement("div");
            name.className = "race-name";
            name.textContent = item.name;
            nameTd.appendChild(name);
            const regionTd = document.createElement("td");
            regionTd.textContent = item.region || "-";
            const typeTd = document.createElement("td");
            typeTd.textContent = roadTypeLabel(item.type, lang);
            const dateTd = document.createElement("td");
            dateTd.textContent = formatDate(item.dateCode, lang);
            const certTd = document.createElement("td");
            certTd.textContent = certLabel(item);
            const statusTd = document.createElement("td");
            const badge = document.createElement("span");
            badge.className = item.participated ? "race-pill joined" : "race-pill not-joined";
            badge.textContent = statusLabel(item.participated, lang);
            statusTd.appendChild(badge);
            tr.append(seqTd, nameTd, regionTd, typeTd, dateTd, certTd, statusTd);
            els.tbody.appendChild(tr);
          });
        }

        function render() {
          const filtered = getFiltered();
          renderStats(filtered);
          renderTable(filtered);
        }

        buildRegionOptions();
        buildCertOptions();
        [els.region, els.roadType, els.caaCert, els.waCert, els.status, els.sortBy].forEach((el) => el.addEventListener("change", render));
        els.search.addEventListener("input", render);
        document.addEventListener("languagechange", () => {
          buildRegionOptions();
          buildCertOptions();
          render();
        });
        render();
      })();
    </script>
